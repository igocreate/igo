name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MYSQL_DATABASE: test

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        # igo connects in utf8mb4: a server left on the default charset breaks
        # on the first accented character.
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --innodb-default-row-format=dynamic
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: --health-cmd="valkey-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The slowest and least stable job: no point paying for it while a type
    # error or a failing unit test already tells us the build is broken.
    needs: [lint, test]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        # igo connects in utf8mb4: a server left on the default charset breaks
        # on the first accented character.
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --innodb-default-row-format=dynamic
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: --health-cmd="valkey-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # auto_migrate only runs in production, and dev.test() only migrates for
      # the test suite: a fresh CI database has no tables until this step
      - run: pnpm migrate
        env:
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}

      # E2E runs against the build, not the dev server: that is what ships
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter ./e2e exec playwright install --with-deps chromium

      # playwright.config.ts starts the API and the front, and waits for both
      - run: pnpm test:e2e
        env:
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
