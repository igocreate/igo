# Les dépendances sont revues à date fixe ; les mineures et correctifs arrivent
# groupés, une PR par mois, pour ne pas noyer les majeures qui demandent un œil.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      mineures:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
