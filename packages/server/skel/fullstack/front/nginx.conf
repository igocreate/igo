# Conf du conteneur du front. Il ne sert que des fichiers : le routage de
# `/api` vers l'API se fait en amont, par le nginx de l'hôte ou le répartiteur
# (voir deploy/nginx.conf.example).

# Les fichiers de assets/ portent un hachage dans leur nom : cache long.
# index.html désigne ceux du build courant, et porte les réglages posés au
# démarrage : revalidé à chaque chargement.
map $uri $cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  # sans privilèges, l'image ne peut pas lier un port sous 1024
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  server_tokens off;

  # Adresse réelle du client derrière le proxy de l'hôte ou le répartiteur.
  # À restreindre aux réseaux du déploiement.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Sans `always` : un 404 sous /assets/ ne doit pas être gardé un an.
  add_header Cache-Control $cache_control;

  # Ce qu'une balise <meta> ne peut pas porter. La politique de sécurité de
  # contenu, elle, est posée au build par vite.config.ts.
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Un asset absent répond 404, et non la page de l'application : sans cela,
  # un chunk disparu après un déploiement arriverait sous forme de HTML.
  location /assets/ {
    try_files $uri =404;
  }

  # Le routage se fait côté navigateur : toute autre adresse rend l'application.
  location / {
    try_files $uri /index.html;
  }
}
